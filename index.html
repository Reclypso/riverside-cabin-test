<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riverside Cabin · look test</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 8 8 3l6 5v6H2z' fill='%23a0522d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/ui.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "postprocessing": "./vendor/postprocessing/postprocessing.js"
      }
    }
  </script>
</head>
<body>
  <div id="loader">
    <div class="loader-title">Riverside Cabin</div>
    <div class="loader-track"><div id="loader-bar"></div></div>
    <div id="loader-label">Preparing…</div>
  </div>
  <div id="panel">
    <div class="row" id="shots"></div>
    <div class="row">
      <button data-tod="day" aria-pressed="true">Day</button>
      <button data-tod="golden" aria-pressed="false">Golden hour</button>
      <button id="orbit" aria-pressed="false" title="Cinematic auto-orbit (O)">Auto-orbit</button>
      <button id="play" class="play" aria-pressed="false" title="Play as the woodsman (C)">▶ Play as woodsman</button>
    </div>
    <div class="hint" id="hint-view">Drag to orbit · right-drag to pan · wheel to zoom · O orbit · T time · H hide · WASD or C to play</div>
    <div class="hint hidden" id="hint-play">WASD / arrows move · Shift run · Space jump · drag to look · wheel zoom · C back to viewer</div>
  </div>
  <div id="fps"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
